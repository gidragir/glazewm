[workspace]
resolver = "2"
members = ["packages/*"]
default-members = ["packages/wm", "packages/wm-cli"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/glzr-io/glazewm"

[workspace.dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3.34"
home = "0.5.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
serde_yml = "0.0.13"
tauri-winres = "0.1.1"
thiserror = "2.0.20"
regex = "1.13.1"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }

# Internal workspace crates
wm-macros = { path = "packages/wm-macros" }
wm-common = { path = "packages/wm-common" }
wm-platform = { path = "packages/wm-platform" }
wm-ipc-client = { path = "packages/wm-ipc-client" }
wm-cli = { path = "packages/wm-cli" }

[workspace.lints]
clippy.all = { level = "warn", priority = -1 }
clippy.pedantic = { level = "warn", priority = -1 }
clippy.missing_errors_doc = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = 1
codegen-units = 256

# Optimize all external dependencies in dev/test builds so that tests (parsing,
# regex matching, serialization, and Tokio runtime) execute significantly faster,
# while workspace crates compile quickly with opt-level 0.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 0
debug = 1
codegen-units = 256

[profile.test.package."*"]
opt-level = 2

# Fast test profile: minimal debug tables (line numbers for backtraces),
# parallel codegen units, and optimized external dependencies.
[profile.test-fast]
inherits = "test"
opt-level = 0
debug = 1
incremental = true
codegen-units = 256

# Performance test / benchmark profile: optimized binary with line-tables for profiling,
# fast parallel codegen, and panic unwinding for test harness compatibility.
[profile.test-perf]
inherits = "release"
opt-level = 3
debug = 1
lto = "thin"
codegen-units = 16
panic = "unwind"
strip = "none"

