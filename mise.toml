[tasks.check]
description = "Fast type-check without linking (using x86_64-pc-windows-gnu)"
run = "cargo check --target x86_64-pc-windows-gnu"

[tasks."check:msvc"]
description = "Type-check using x86_64-pc-windows-msvc target"
run = "cargo check --target x86_64-pc-windows-msvc"

[tasks.clippy]
description = "Run strict pedantic Clippy checks"
run = "cargo clippy --target x86_64-pc-windows-gnu -- -D warnings"

[tasks.test]
description = "Run unit tests for wm, wm-common, and wm-ipc-client"
run = "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER=wine cargo xwin test -p wm -p wm-common -p wm-ipc-client --target x86_64-pc-windows-msvc"

[tasks.benchmark]
description = "Run layout and event loop performance benchmarks"
run = "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER=wine cargo xwin test -p wm --target x86_64-pc-windows-msvc -- benchmark --nocapture"

[tasks.verify]
description = "Run all verification checks (check, clippy, test)"
depends = ["check", "clippy", "test"]

[tasks."build:debug"]
description = "Build debug binary (glazewm.exe) with MSVC target"
run = "cargo xwin build -p wm --target x86_64-pc-windows-msvc"

[tasks.build]
description = "Build release binary (glazewm.exe) with MSVC target"
run = "cargo xwin build --release -p wm --target x86_64-pc-windows-msvc"

[tasks."build:all"]
description = "Build all workspace release packages (wm, wm-cli, wm-watcher)"
run = "cargo xwin build --release --target x86_64-pc-windows-msvc"

[tasks.deploy]
description = "Copy compiled release binaries to Windows VM share (/srv/Shared)"
run = "cp target/x86_64-pc-windows-msvc/release/glazewm*.exe /srv/Shared/"

[tasks.release]
description = "Build all packages and deploy to Windows VM share"
depends = ["build:all"]
run = "cp target/x86_64-pc-windows-msvc/release/glazewm*.exe /srv/Shared/"

[tasks."sonar:status"]
description = "Check SonarCloud quality gate status"
run = "python3 resources/scripts/sonar.py status"

[tasks."sonar:issues"]
description = "List open SonarCloud issues"
run = "python3 resources/scripts/sonar.py issues"

[tasks."sonar:summary"]
description = "Print high-level summary of SonarCloud issues grouped by rule and severity"
run = "python3 resources/scripts/sonar.py summary"

